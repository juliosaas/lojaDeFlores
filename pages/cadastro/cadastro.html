<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <header>
        <nav>
            <a href="../login/login.html"><button type="button">Login</button></a>
        </nav>
        <h1>Cadastre-se</h1>
    </header>

    <main>
        <form action="../login/login.html" id="cadastroForm" onsubmit="alert('Cadastro criado')">
            <div class="field">
                <label for="nome">Nome completo:</label>
                <input id="nome" required type="text">
            </div>

            <div class="field">
                <label for="email">Email:</label>
                <input id="email" required type="email">
            </div>

            <div class="field">
                <label for="senha">Senha:</label>
                <input id="senha" required type="password">
            </div>

            <div class="field">
                <label for="confirmaSenha">Confirme sua senha:</label>
                <input id="confirmaSenha" required type="password">
            </div>

            <div class="field">
                <label for="rg">RG:</label>
                <input id="rg" required type="text" inputmode="numeric">
            </div>

            <div class="field">
                <label for="cpf">CPF:</label>
                <input id="cpf" required type="text" inputmode="numeric">
            </div>

            <div class="field">
                <label for="endereco">Endereço:</label>
                <input id="endereco" required type="text">
            </div>

            <div class="field">
                <label for="cep">CEP:</label>
                <input id="cep" required type="text" inputmode="numeric">
            </div>

            <div class="field">
                <label for="cidade">Cidade:</label>
                <input id="cidade" required type="text">
            </div>

            <div class="field">
                <label for="estado">Estado:</label>
                <input id="estado" required type="text">
            </div>

            <div class="field">
                <label for="pais">País:</label>
                <input id="pais" required type="text">
            </div>

            <div class="field">
                <label for="nascimento">Data de nascimento:</label>
                <input id="nascimento" required type="date">
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <footer>

    </footer>
    <script src="cadastro.js"></script>
</body>
</html>
