<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
        <nav>
            <a href="../../index.html"><button type="button">&#60; Home</button></a>
        </nav>
        <h1>Login</h1>
    </header>

    <main>
        <label for="inputLogin">Login:</label>
        <input id="inputLogin" required placeholder="Insira seu email" type="text">

        <label for="inputSenha">Senha:</label>
        <input id="inputSenha" aria-required="true" placeholder="Insira sua senha" type="password">

        <a class="forgotPassword" target="_blank" href="../esqueciMinhaSenha/esqueciMinhaSenha.html">Esqueceu sua senha? Clique aqui.</a>

        <button type="button" onclick="validarLogin()">Entrar</button>

        <p class="registerText">Ainda não tem cadastro? <a href="../cadastro/cadastro.html">Cadastre-se</a></p>
    </main>

    <script src="login.js"></script>
</body>

</html>
