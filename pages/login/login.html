<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
        <nav>
            <a href="../../index.html"><button type="button">&#60; Home</button></a>
        </nav>
        <h1>Login</h1>
    </header>

    <main>
        <form action="../../index.html" id="loginForm">
            <label for="email">Login:</label>
            <input id="email" required placeholder="Insira seu email" type="email">

            <label for="senha">Senha:</label>
            <input id="senha" aria-required="true" placeholder="Insira sua senha" type="password">

            <a class="forgotPassword" target="_blank" href="../esqueciMinhaSenha/esqueciMinhaSenha.html">Esqueceu sua senha? Clique aqui.</a>

            <button type="submit">Entrar</button>

            <p class="registerText">Ainda não tem cadastro? <a href="../cadastro/cadastro.html">Cadastre-se</a></p>
        </form>
    </main>

</body>

</html>
